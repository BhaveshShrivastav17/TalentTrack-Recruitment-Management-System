<template>
    <lightning-card title="TalentTrack | Career Opportunities" icon-name="standard:work_order">
        <div class="job-container">

            <!-- HERO SECTION -->
            <section class="hero-section">
                <div class="hero-content">
                    <p class="hero-eyebrow">YOUR NEXT CAREER STARTS HERE</p>
                    <h1>Discover opportunities.<br />Build your future.</h1>
                    <p class="hero-description">
                        Explore open positions, find roles that match your interests,
                        and follow your application journey with TalentTrack.
                    </p>
                </div>
                <div class="hero-icon">
                    <lightning-icon icon-name="standard:employee" size="large" alternative-text="Career opportunities">
                    </lightning-icon>
                </div>
            </section>

            <!-- SEARCH AND FILTER -->
            <section class="section-card search-section">
                <div class="section-heading">
                    <div>
                        <p class="section-eyebrow">EXPLORE OPPORTUNITIES</p>
                        <h2>Find Your Next Opportunity</h2>
                        <p class="section-subtitle">
                            Search by job title or narrow your results by department.
                        </p>
                    </div>
                </div>

                <div class="filter-grid">
                    <lightning-input type="search" label="Search Jobs" placeholder="Search by job title..."
                        value={searchKey} onchange={handleSearch}>
                    </lightning-input>

                    <lightning-combobox label="Department" placeholder="All Departments" options={departmentOptions}
                        value={selectedDepartment} onchange={handleDepartmentChange}>
                    </lightning-combobox>
                </div>
            </section>

            <!-- JOB LISTINGS -->
            <section class="listings-section">
                <div class="section-heading listings-heading">
                    <div>
                        <p class="section-eyebrow">CAREER OPPORTUNITIES</p>
                        <h2>Available Positions</h2>
                        <p class="section-subtitle">
                            Browse the latest opportunities and find your next role.
                        </p>
                    </div>
                    <div class="result-label">
                        <lightning-icon icon-name="utility:briefcase" size="x-small" alternative-text="Jobs">
                        </lightning-icon>
                        <span>{filteredJobs.length} positions</span>
                    </div>
                </div>

                <!-- LOADING -->
                <template if:true={isLoading}>
                    <div class="state-card">
                        <lightning-spinner alternative-text="Loading available jobs" size="medium">
                        </lightning-spinner>
                        <p>Loading available opportunities...</p>
                    </div>
                </template>

                <!-- JOB LOAD ERROR -->
                <template if:true={hasJobError}>
                    <div class="state-card error-state">
                        <lightning-icon icon-name="utility:error" size="large" alternative-text="Error">
                        </lightning-icon>
                        <h3>Unable to Load Jobs</h3>
                        <p>
                            We couldn't retrieve the job listings.
                            Please try again later or contact the administrator.
                        </p>
                    </div>
                </template>

                <!-- JOB CARDS -->
                <template if:true={hasJobs}>
                    <div class="jobs-grid">
                        <template for:each={filteredJobs} for:item="job">
                            <article key={job.Id} class="job-card">

                                <div class="job-card-top">
                                    <div class="job-title-group">
                                        <h3 class="job-title">{job.Job_Title__c}</h3>
                                        <p class="job-department">
                                            {job.Department__c} Department
                                        </p>
                                    </div>
                                    <lightning-badge label="Open"></lightning-badge>
                                </div>

                                <div class="job-info">
                                    <div class="job-info-item">
                                        <span class="info-label">Location</span>
                                        <span class="info-value">{job.Location__c}</span>
                                    </div>

                                    <div class="job-info-item">
                                        <span class="info-label">Salary</span>
                                        <span class="info-value">
                                            <lightning-formatted-number value={job.Salary__c} format-style="currency"
                                                currency-code="INR" maximum-fraction-digits="0">
                                            </lightning-formatted-number>
                                        </span>
                                    </div>

                                    <div class="job-info-item">
                                        <span class="info-label">Job Type</span>
                                        <span class="info-value">{job.Job_Type__c}</span>
                                    </div>

                                    <div class="job-info-item">
                                        <span class="info-label">Experience</span>
                                        <span class="info-value">{job.Experience_Required__c}</span>
                                    </div>

                                    <div class="job-info-item deadline-item">
                                        <span class="info-label">Application Deadline</span>
                                        <span class="info-value">
                                            <lightning-formatted-date-time value={job.Application_Deadline__c}
                                                year="numeric" month="short" day="2-digit" time-zone="UTC">
                                            </lightning-formatted-date-time>
                                        </span>
                                    </div>
                                </div>

                                <div class="job-description">
                                    <span class="info-label">ABOUT THIS ROLE</span>
                                    <p>{job.Job_Description__c}</p>
                                </div>

                                <div class="job-actions">
                                    <lightning-button label="Apply for Job" variant="brand" icon-name="utility:send"
                                        data-job-id={job.Id} onclick={handleApplyClick}>
                                    </lightning-button>

                                    <lightning-button label="View Details" variant="neutral" icon-name="utility:preview"
                                        data-job-id={job.Id} onclick={handleViewDetails}>
                                    </lightning-button>
                                </div>
                            </article>
                        </template>
                    </div>
                </template>

                <!-- NO OPEN JOBS -->
                <template if:true={hasNoOpenJobs}>
                    <div class="state-card">
                        <lightning-icon icon-name="utility:briefcase" size="large" alternative-text="No open jobs">
                        </lightning-icon>
                        <h3>No Open Positions Right Now</h3>
                        <p>
                            There are currently no open job opportunities.
                            Please check back later.
                        </p>
                    </div>
                </template>

                <!-- NO FILTER MATCHES -->
                <template if:true={hasNoMatchingJobs}>
                    <div class="state-card">
                        <lightning-icon icon-name="utility:search" size="large" alternative-text="No matching jobs">
                        </lightning-icon>
                        <h3>No Matching Jobs Found</h3>
                        <p>
                            Try another job title or select a different department.
                        </p>
                    </div>
                </template>
            </section>

            <!-- JOB DETAILS -->
            <template if:true={showJobDetails}>
                <template if:true={selectedJob}>
                    <section class="section-card detail-section">
                        <div class="section-heading detail-heading">
                            <div>
                                <p class="section-eyebrow">POSITION INFORMATION</p>
                                <h2>Job Details</h2>
                            </div>

                            <lightning-button-icon icon-name="utility:close" alternative-text="Close job details"
                                title="Close" onclick={handleCloseDetails}>
                            </lightning-button-icon>
                        </div>

                        <h3 class="detail-job-title">{selectedJob.Job_Title__c}</h3>
                        <p class="job-department">{selectedJob.Department__c} Department</p>

                        <div class="job-info detail-info">
                            <div class="job-info-item">
                                <span class="info-label">Location</span>
                                <span class="info-value">{selectedJob.Location__c}</span>
                            </div>

                            <div class="job-info-item">
                                <span class="info-label">Salary</span>
                                <span class="info-value">
                                    <lightning-formatted-number value={selectedJob.Salary__c} format-style="currency"
                                        currency-code="INR" maximum-fraction-digits="0">
                                    </lightning-formatted-number>
                                </span>
                            </div>

                            <div class="job-info-item">
                                <span class="info-label">Job Type</span>
                                <span class="info-value">{selectedJob.Job_Type__c}</span>
                            </div>

                            <div class="job-info-item">
                                <span class="info-label">Experience Required</span>
                                <span class="info-value">{selectedJob.Experience_Required__c}</span>
                            </div>

                            <div class="job-info-item">
                                <span class="info-label">Application Deadline</span>
                                <span class="info-value">
                                    <lightning-formatted-date-time value={selectedJob.Application_Deadline__c}
                                        year="numeric" month="short" day="2-digit" time-zone="UTC">
                                    </lightning-formatted-date-time>
                                </span>
                            </div>
                        </div>

                        <div class="job-description detail-description">
                            <span class="info-label">JOB DESCRIPTION</span>
                            <p>{selectedJob.Job_Description__c}</p>
                        </div>

                        <div class="job-actions">
                            <lightning-button label="Apply for This Job" variant="brand" icon-name="utility:send"
                                data-job-id={selectedJob.Id} onclick={handleApplyClick}>
                            </lightning-button>

                            <lightning-button label="Close Details" variant="neutral" onclick={handleCloseDetails}>
                            </lightning-button>
                        </div>
                    </section>
                </template>
            </template>

            <!-- APPLICATION FORM -->
            <template if:true={showApplyForm}>
                <section class="section-card application-section">
                    <div class="section-heading">
                        <div>
                            <p class="section-eyebrow">TAKE THE NEXT STEP</p>
                            <h2>Submit Your Application</h2>
                            <p class="section-subtitle">
                                Select your candidate profile to apply for this position.
                            </p>
                        </div>
                    </div>

                    <template if:true={selectedJob}>
                        <div class="selected-job-summary">
                            <span class="info-label">APPLYING FOR</span>
                            <h3>{selectedJob.Job_Title__c}</h3>
                            <p>{selectedJob.Department__c} Department</p>
                        </div>
                    </template>

                    <lightning-combobox label="Select Candidate" placeholder="Choose your candidate profile"
                        options={candidateOptions} value={selectedCandidateId} onchange={handleCandidateChange}
                        required>
                    </lightning-combobox>

                    <template if:true={isSubmitting}>
                        <div class="inline-spinner">
                            <lightning-spinner alternative-text="Submitting application" size="small">
                            </lightning-spinner>
                        </div>
                    </template>

                    <div class="job-actions">
                        <lightning-button label="Submit Application" variant="brand" icon-name="utility:check"
                            onclick={handleSubmitApplication} disabled={isSubmitting}>
                        </lightning-button>

                        <lightning-button label="Cancel" variant="neutral" onclick={handleCancelApplication}
                            disabled={isSubmitting}>
                        </lightning-button>
                    </div>
                </section>
            </template>

            <!-- APPLICATION STATUS -->
            <section class="section-card status-section">
                <div class="section-heading">
                    <div>
                        <p class="section-eyebrow">APPLICATION TRACKER</p>
                        <h2>Track Your Applications</h2>
                        <p class="section-subtitle">
                            Select a candidate to view their submitted applications and current status.
                        </p>
                    </div>
                </div>

                <lightning-combobox label="Select Candidate" placeholder="Choose a candidate"
                    options={statusCandidateOptions} value={selectedStatusCandidateId}
                    onchange={handleStatusCandidateChange}>
                </lightning-combobox>

                <template if:true={showApplicationStatus}>
                    <div class="history-section">
                        <h3>Application History</h3>

                        <template if:true={isLoadingApplications}>
                            <div class="state-card compact-state">
                                <lightning-spinner alternative-text="Loading application history" size="medium">
                                </lightning-spinner>
                                <p>Loading application history...</p>
                            </div>
                        </template>

                        <template if:true={hasApplications}>
                            <div class="history-list">
                                <template for:each={candidateApplications} for:item="app">
                                    <article key={app.Id} class="history-card">
                                        <div class="history-card-heading">
                                            <div>
                                                <h4>{app.Job__r.Job_Title__c}</h4>
                                                <p class="history-id">Application ID: {app.Name}</p>
                                            </div>
                                            <lightning-badge label={app.Application_Status__c}>
                                            </lightning-badge>
                                        </div>

                                        <div class="job-info history-info">
                                            <div class="job-info-item">
                                                <span class="info-label">Application Date</span>
                                                <span class="info-value">
                                                    <lightning-formatted-date-time value={app.Application_Date__c}
                                                        year="numeric" month="short" day="2-digit" time-zone="UTC">
                                                    </lightning-formatted-date-time>
                                                </span>
                                            </div>

                                            <div class="job-info-item">
                                                <span class="info-label">Application Status</span>
                                                <span class="info-value">{app.Application_Status__c}</span>
                                            </div>
                                        </div>
                                    </article>
                                </template>
                            </div>
                        </template>

                        <template if:true={hasNoApplications}>
                            <div class="empty-history">
                                <lightning-icon icon-name="utility:info" size="small" alternative-text="Information">
                                </lightning-icon>
                                <p>No applications found for this candidate.</p>
                            </div>
                        </template>
                    </div>
                </template>
            </section>

            <!-- FOOTER -->
            <footer class="page-footer">
                <p>TalentTrack | Recruitment Management System</p>
                <span>Connecting talent with opportunity.</span>
            </footer>

        </div>
    </lightning-card>
</template>
